name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/*/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l services)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
      - run: go build ./...
        working-directory: services/ingestion
      - run: go build ./...
        working-directory: services/embedding
      - run: go vet ./...
        working-directory: services/ingestion
      - run: go vet ./...
        working-directory: services/embedding
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          (cd services/ingestion && staticcheck ./...)
          (cd services/embedding && staticcheck ./...)
      - run: go test -race ./...
        working-directory: services/ingestion
      - run: go test -race ./...
        working-directory: services/embedding

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database and apply migrations
        run: supabase db start
      - name: RLS isolation suite, blocks merge unconditionally
        run: supabase test db
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/*/go.sum
      - name: Ingestion integration tests
        run: go test -race ./...
        working-directory: services/ingestion
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Embedding integration tests
        run: go test -race ./...
        working-directory: services/embedding
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
